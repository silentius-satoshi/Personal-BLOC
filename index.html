    <!-- SW diagnostic (start-up) — dependency-free, runs before/without the app bundle (5e, F2). It listens from its first
         line — runtime errors, rejections, and a script, chunk or stylesheet that fails to load — and keeps the first 50
         lines. It paints on ?swdebug at once (and stays: it was asked for), or after a 15 s watchdog if the app hasn't
         started: window.__APP_BOOTED, which main.tsx sets once the whole bundle has run. A watchdog panel removes itself
         the moment the app starts, so it never stays over a healthy start. Decisive signal: a 'personal-bloc-v1' cache key
         means the OLD hand-rolled SW is still active; a 'workbox-precache-*' key means the new Workbox SW installed.
         ES5 only: it must run where the bundle can't. Pinned by src/__tests__/swDiag.test.ts. -->
    <script>
    (function () {
      var WATCHDOG_MS = 15000;   // BL23's time limit (5e, F2; it was 6 s)
      var KEEP = 50;             // the first lines heard: a failed start's first error comes first
      var heard = [];
      var dropped = 0;
      var panel = null;

      function appendLine(text) {
        if (!panel) return;      // a watchdog panel the app's start removed: its late probes have nowhere to go
        var el = document.createElement('div');
        el.textContent = text;
        panel.appendChild(el);
      }

      function note(text) {
        if (panel) { appendLine(text); return; }
        if (heard.length < KEEP) heard.push(text); else dropped++;
      }

      // From the first moment, not from the panel's: an error while the bundle loads or runs is the one that matters.
      // The capture phase hears a script, chunk or stylesheet that fails to load (those events don't bubble).
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && t !== window && (t.src || t.href)) note('failed to load: ' + (t.src || t.href));
        else note('window.onerror: ' + (e && e.message ? e.message : 'unknown error'));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason;
        note('unhandledrejection: ' + (reason && reason.message ? reason.message : String(reason)));
      });

      function activateNow(byWatchdog) {
        if (panel || document.getElementById('sw-diag-panel')) return;
        if (byWatchdog && window.__APP_BOOTED) return;   // the app started while the page settled: never paint over it
        panel = document.createElement('div');
        panel.id = 'sw-diag-panel';
        panel.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0d0d0d;color:#e5e5e5;' +
          'font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;padding:16px;' +
          'overflow:auto;z-index:2147483647;white-space:pre-wrap;';
        var header = document.createElement('div');
        header.textContent = 'SW DIAG';
        header.style.cssText = 'font-weight:bold;font-size:14px;color:#ff6b6b;margin-bottom:10px;';
        panel.appendChild(header);
        document.body.appendChild(panel);

        var i;
        if (heard.length || dropped) {
          appendLine('heard before the panel:');
          for (i = 0; i < heard.length; i++) appendLine('  ' + heard[i]);
          if (dropped) appendLine('  … and ' + dropped + ' more');
          heard = [];
          dropped = 0;
        }

        appendLine('navigator.onLine: ' + navigator.onLine);

        if ('serviceWorker' in navigator) {
          var controller = navigator.serviceWorker.controller;
          appendLine(controller ? ('controller: ' + controller.scriptURL + ' (controlling)') : 'controller: NO CONTROLLER');

          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (!reg) { appendLine('registration: none'); return; }
            var any = false;
            if (reg.installing) { appendLine('installing: ' + reg.installing.scriptURL + ' [' + reg.installing.state + ']'); any = true; }
            if (reg.waiting)   { appendLine('waiting: '   + reg.waiting.scriptURL   + ' [' + reg.waiting.state   + ']'); any = true; }
            if (reg.active)    { appendLine('active: '    + reg.active.scriptURL    + ' [' + reg.active.state    + ']'); any = true; }
            if (!any) appendLine('registration: no workers');
          }, function (e) {
            appendLine('getRegistration failed: ' + (e && e.message ? e.message : e));
          });
        } else {
          appendLine('serviceWorker: not supported');
        }

        if ('caches' in window) {
          caches.keys().then(function (keys) {
            appendLine('caches.keys(): ' + (keys.length ? keys.join(', ') : '(none)'));

            var hasOld = false, workboxCache = null, k;
            for (k = 0; k < keys.length; k++) {
              if (keys[k] === 'personal-bloc-v1') hasOld = true;
              if (keys[k].indexOf('workbox-precache') === 0) workboxCache = keys[k];
            }
            if (hasOld) appendLine('WARNING: legacy personal-bloc-v1 cache present (old hand-rolled SW)');
            if (workboxCache) {
              appendLine('workbox precache: ' + workboxCache);
              caches.open(workboxCache).then(function (cache) {
                return cache.keys();
              }).then(function (reqs) {
                appendLine(workboxCache + ' entry count: ' + reqs.length);
              });
            } else {
              appendLine('no workbox-precache-* cache found');
            }

            var scripts = document.scripts, s;
            for (s = 0; s < scripts.length; s++) {
              (function (src) {
                if (!src) return;
                var sameOrigin = false;
                try { sameOrigin = (new URL(src, location.href)).origin === location.origin; } catch (e) {}
                if (!sameOrigin) return;
                caches.match(src).then(function (match) {
                  appendLine('script ' + src + ': ' + (match ? 'OK' : 'MISS'));
                });
              })(scripts[s].src);
            }
          }, function (e) {
            appendLine('caches.keys() failed: ' + (e && e.message ? e.message : e));
          });
        } else {
          appendLine('caches API: not supported');
        }

        // A watchdog panel goes the moment the app starts (a slow network, not a broken install). Only the panel it
        // painted — never a ?swdebug one.
        if (byWatchdog) {
          var shown = panel;
          var poll = setInterval(function () {
            if (!window.__APP_BOOTED) return;
            clearInterval(poll);
            if (shown.parentNode) shown.parentNode.removeChild(shown);
            if (panel === shown) panel = null;
          }, 250);
        }
      }

      function whenBodyReady(cb) {
        if (document.body) { cb(); return; }
        document.addEventListener('DOMContentLoaded', cb);
      }

      if (location.search.indexOf('swdebug') !== -1) {
        whenBodyReady(function () { activateNow(false); });
      }

      setTimeout(function () {
        if (!window.__APP_BOOTED) {
          whenBodyReady(function () { activateNow(true); });
        }
      }, WATCHDOG_MS);
    })();
    </script>
